<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #7c6af7;
    --accent2: #a78bfa;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --user-bubble: #1e1b40;
    --ai-bubble: #13131e;
    --danger: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Ambient glow */
  body::before {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(124,106,247,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,15,0.8);
    backdrop-filter: blur(12px);
    position: relative;
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .model-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 20px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .api-key-area {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .api-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 8px;
    width: 220px;
    outline: none;
    transition: border-color 0.2s;
  }

  .api-input:focus { border-color: var(--accent); }
  .api-input::placeholder { color: var(--muted); }

  .btn-save {
    background: var(--accent);
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-save:hover { opacity: 0.85; }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .status-dot.active { background: #4ade80; box-shadow: 0 0 8px #4ade8066; }

  /* Chat area */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 32px 0;
    position: relative;
    z-index: 1;
  }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .messages-wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 16px;
    opacity: 0.5;
    min-height: 300px;
  }

  .empty-icon {
    font-size: 48px;
    filter: grayscale(0.5);
  }

  .empty-text {
    font-size: 16px;
    font-weight: 600;
    color: var(--muted);
  }

  .empty-sub {
    font-size: 13px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  /* Messages */
  .msg {
    display: flex;
    gap: 14px;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .avatar.ai {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }

  .avatar.user {
    background: var(--surface2);
    border: 1px solid var(--border);
  }

  .bubble {
    max-width: 80%;
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.ai .bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    color: var(--text);
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    border: 1px solid rgba(124,106,247,0.3);
    border-top-right-radius: 4px;
    color: var(--text);
  }

  /* Thinking indicator */
  .thinking {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 16px 18px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Input area */
  .input-area {
    padding: 20px 24px;
    border-top: 1px solid var(--border);
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(12px);
    position: relative;
    z-index: 10;
  }

  .input-wrap {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .textarea-wrap {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: flex-end;
    padding: 4px 4px 4px 16px;
    transition: border-color 0.2s;
  }

  .textarea-wrap:focus-within { border-color: var(--accent); }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    resize: none;
    min-height: 24px;
    max-height: 160px;
    line-height: 1.6;
    padding: 10px 0;
  }

  textarea::placeholder { color: var(--muted); }

  .send-btn {
    width: 40px;
    height: 40px;
    background: var(--accent);
    border: none;
    border-radius: 9px;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s, transform 0.1s;
    flex-shrink: 0;
    margin: 4px;
  }

  .send-btn:hover { opacity: 0.85; }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .clear-btn {
    height: 48px;
    padding: 0 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .clear-btn:hover {
    border-color: var(--danger);
    color: var(--danger);
  }

  .hint {
    max-width: 760px;
    margin: 8px auto 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    padding: 0 4px;
  }

  /* Error */
  .error-msg {
    color: var(--danger);
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.2);
    padding: 10px 14px;
    border-radius: 8px;
  }

  /* Code blocks in AI response */
  .bubble code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 4px;
  }

  .bubble pre {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin: 8px 0;
    overflow-x: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  .bubble pre code {
    background: transparent;
    padding: 0;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">✦</div>
    AI Chat
  </div>
  <span class="model-badge">claude-sonnet-4-20250514</span>
  <div class="header-right">
    <div class="status-dot" id="statusDot"></div>
    <div class="api-key-area">
      <input type="password" class="api-input" id="apiKeyInput" placeholder="sk-ant-api03-...">
      <button class="btn-save" onclick="saveKey()">Save</button>
    </div>
  </div>
</header>

<div id="chat">
  <div class="messages-wrap" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">✦</div>
      <div class="empty-text">Start a conversation</div>
      <div class="empty-sub">Enter your API key and type a message</div>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <div class="textarea-wrap">
      <textarea id="msgInput" placeholder="Type a message..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    </div>
    <button class="clear-btn" onclick="clearChat()">Clear</button>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for new line</div>
</div>

<script>
let apiKey = localStorage.getItem('claude_api_key') || '';
let history = [];
let isLoading = false;

// Init
if (apiKey) {
  document.getElementById('apiKeyInput').value = apiKey;
  document.getElementById('statusDot').classList.add('active');
}

function saveKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (!val) return;
  apiKey = val;
  localStorage.setItem('claude_api_key', val);
  document.getElementById('statusDot').classList.add('active');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function clearChat() {
  history = [];
  const msgs = document.getElementById('messages');
  msgs.innerHTML = `<div class="empty-state" id="emptyState">
    <div class="empty-icon">✦</div>
    <div class="empty-text">Start a conversation</div>
    <div class="empty-sub">Enter your API key and type a message</div>
  </div>`;
}

function appendMsg(role, content) {
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();

  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatar = role === 'ai' ? '✦' : '▲';
  const avatarClass = role === 'ai' ? 'ai' : 'user';

  div.innerHTML = `
    <div class="avatar ${avatarClass}">${avatar}</div>
    <div class="bubble" id="bubble-${Date.now()}">${escapeHtml(content)}</div>
  `;

  msgs.appendChild(div);
  scrollBottom();
  return div.querySelector('.bubble');
}

function appendThinking() {
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();

  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'thinking';
  div.innerHTML = `
    <div class="avatar ai">✦</div>
    <div class="bubble ai-bubble">
      <div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
  `;
  msgs.appendChild(div);
  scrollBottom();
}

function appendError(msg) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.innerHTML = `<div class="error-msg">⚠ ${escapeHtml(msg)}</div>`;
  msgs.appendChild(div);
  scrollBottom();
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function scrollBottom() {
  const chat = document.getElementById('chat');
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  if (isLoading) return;

  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  if (!apiKey) {
    alert('Please enter your API key first');
    return;
  }

  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  appendMsg('user', text);
  history.push({ role: 'user', content: text });

  appendThinking();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1024,
        messages: history
      })
    });

    const data = await res.json();
    document.getElementById('thinking')?.remove();

    if (!res.ok) {
      appendError(data.error?.message || `Error ${res.status}`);
    } else {
      const reply = data.content[0]?.text || '';
      history.push({ role: 'assistant', content: reply });
      appendMsg('ai', reply);
    }
  } catch (err) {
    document.getElementById('thinking')?.remove();
    appendError(err.message);
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}
</script>
</body>
</html>
